<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<main id="app" class="app" aria-live="polite"></main>
<div id="dusk" class="dusk" aria-hidden="true"></div>
<div id="drawer" class="drawer" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="hunt" class="hunt" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:Georgia,serif">Kara Defter’i oynamak için JavaScript gerekli.</p></noscript>
