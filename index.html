<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipler</title>
<style>
  :root { --paper: #ece4d2; --ink: #1d1a17; --muted: #6d655a; --line: #cfc4ad; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
         font: 16px/1.5 Georgia, "Times New Roman", serif; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: normal; margin: 0 0 20px; }
  a { display: block; padding: 20px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  a:last-child { border-bottom: 1px solid var(--line); }
  strong { display: block; font-size: 26px; font-weight: normal; }
  span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Prototipler</h1>
  <a href="harena/"><strong>Harena</strong><span>Gladyatör okulu: yaralar, lakaplar, mezar taşları, meydan okuma linki</span></a>
  <a href="kara-defter/"><strong>Kara Defter</strong><span>Günlük folklor vakası: ipucu topla, yaratığı teşhis et, hazırlan</span></a>
</main>
</body>
</html>
